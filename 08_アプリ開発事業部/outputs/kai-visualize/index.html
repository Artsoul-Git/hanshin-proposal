<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kai Visualize</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:#eef0f4;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:20px}

/* ── Header ── */
.hdr{background:white;border-radius:12px;padding:16px 22px;margin-bottom:16px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;align-items:center;gap:16px}
.hdr-title{font-size:15px;font-weight:bold;color:#1a1a1a;flex:1;cursor:pointer}
.bc{display:flex;align-items:center;gap:0;flex-wrap:wrap;font-size:13px}
.bc-btn{color:#1565c0;cursor:pointer;padding:3px 8px;border-radius:6px;transition:background .15s;white-space:nowrap}
.bc-btn:hover{background:#e8f0fe}
.bc-btn.cur{color:#444;cursor:default;font-weight:bold}
.bc-btn.cur:hover{background:transparent}
.bc-sep{color:#bbb;padding:0 2px}
.srv-badge{font-size:11px;padding:3px 9px;border-radius:12px;font-weight:bold;white-space:nowrap}
.srv-ok{background:#e8f5e9;color:#2e7d32}
.srv-ng{background:#fce4e4;color:#c62828}

/* ── View ── */
.view{display:none}
.view.active{display:block;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── Card ── */
.card{background:white;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:28px}
.card-title{font-size:18px;font-weight:bold;color:#1a1a1a;margin-bottom:4px}
.card-meta{font-size:13px;color:#888;margin-bottom:22px}

/* ── Buttons ── */
.toolbar{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid #eee;padding-top:16px}
.btn{padding:8px 16px;border:1px solid #ddd;border-radius:7px;cursor:pointer;font-size:13px;
  background:#f8f9fa;font-family:inherit;transition:background .15s}
.btn:hover{background:#e2e6ea}
.btn-primary{background:#1565c0;color:white;border-color:#1565c0}
.btn-primary:hover{background:#0d47a1}
.hint{font-size:12px;color:#888}

/* ══ HOME ══ */
.home-hero{background:white;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);
  padding:48px 28px 36px;text-align:center;margin-bottom:20px}
.home-title{font-size:26px;font-weight:bold;color:#1a1a1a;margin-bottom:8px}
.home-sub{font-size:14px;color:#666;margin-bottom:28px;line-height:1.6}
.home-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-new{background:linear-gradient(135deg,#7C3AED,#4f46e5);color:white;border:none;
  padding:14px 32px;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit;
  transition:opacity .15s;box-shadow:0 3px 14px rgba(124,58,237,.35)}
.btn-new:hover{opacity:.88}
.btn-outline{background:white;border:2px solid #ddd;padding:12px 20px;border-radius:10px;
  font-size:14px;cursor:pointer;font-family:inherit;color:#555;text-decoration:none;
  display:inline-flex;align-items:center;transition:border-color .15s,color .15s}
.btn-outline:hover{border-color:#7C3AED;color:#7C3AED}
.home-section-label{font-size:13px;font-weight:bold;color:#444;margin-bottom:12px}
.session-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.session-card{background:white;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.07);
  padding:18px 20px;cursor:pointer;border:2px solid transparent;
  transition:border-color .15s,box-shadow .15s}
.session-card:hover{border-color:#7C3AED;box-shadow:0 4px 20px rgba(124,58,237,.15)}
.sc-title{font-size:15px;font-weight:bold;color:#1a1a1a;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-theme{font-size:11px;color:#aaa;margin-bottom:8px}
.sc-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.sc-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:bold}
.sc-badge.done{background:#e8f5e9;color:#2e7d32}
.sc-badge.none{background:#f5f5f5;color:#ccc}
.sc-date{font-size:11px;color:#bbb}
.sc-memo{font-size:11px;color:#888;margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ══ HISTORY ══ */
.hist-item{border:1px solid #eee;border-radius:10px;padding:16px 18px;margin-bottom:10px;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.hist-item:hover{border-color:#ddd}
.hist-title-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.hist-title{font-size:15px;font-weight:bold;color:#1a1a1a;cursor:pointer}
.hist-title:hover{color:#7C3AED}
.hist-edit-icon{font-size:12px;color:#bbb;cursor:pointer;user-select:none}
.hist-edit-icon:hover{color:#7C3AED}
.hist-theme{font-size:11px;color:#aaa;margin-bottom:6px}
.hist-memo{font-size:12px;color:#666;margin-bottom:8px;cursor:pointer;line-height:1.5}
.hist-memo:hover{color:#7C3AED}
.hist-memo.empty{color:#ccc;font-style:italic}
.hist-date{font-size:11px;color:#bbb;margin-top:4px}
.hist-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hist-btn{padding:6px 14px;border:1px solid #ddd;border-radius:6px;font-size:12px;
  cursor:pointer;background:#f8f9fa;font-family:inherit;white-space:nowrap}
.hist-btn:hover{background:#e2e6ea}
.hist-btn.open{background:#7C3AED;color:white;border-color:#7C3AED}
.hist-btn.open:hover{background:#6d28d9}
.hist-btn.del{color:#c62828;border-color:#ffcdd2}
.hist-btn.del:hover{background:#ffebee}
.inline-input{border:1.5px solid #7C3AED;border-radius:5px;padding:3px 8px;
  font-size:14px;font-family:inherit;outline:none;width:100%}
.inline-textarea{border:1.5px solid #7C3AED;border-radius:5px;padding:5px 8px;
  font-size:12px;font-family:inherit;outline:none;width:100%;resize:none;
  min-height:50px;line-height:1.5}
.inline-save-row{display:flex;gap:6px;margin-top:5px}
.inline-btn{padding:4px 12px;border-radius:5px;font-size:12px;cursor:pointer;font-family:inherit}
.inline-btn.save{background:#7C3AED;color:white;border:none}
.inline-btn.cancel{background:#f8f9fa;border:1px solid #ddd;color:#555}

/* ══ MODAL ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-box{background:white;border-radius:14px;padding:32px;width:500px;max-width:92vw;
  box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-title{font-size:19px;font-weight:bold;margin-bottom:6px}
.modal-sub{font-size:13px;color:#888;margin-bottom:22px;line-height:1.6}
.modal-input{width:100%;padding:12px 16px;border:2px solid #ddd;border-radius:8px;
  font-size:15px;font-family:inherit;outline:none;margin-bottom:16px;transition:border-color .15s}
.modal-input:focus{border-color:#7C3AED}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.modal-cancel{padding:10px 20px;border:1px solid #ddd;border-radius:7px;cursor:pointer;
  font-size:14px;background:white;font-family:inherit}
.modal-ok{padding:10px 24px;border:none;border-radius:7px;cursor:pointer;font-size:14px;
  background:#7C3AED;color:white;font-family:inherit}
.modal-ok:hover{background:#6d28d9}

/* ══ MANDALA ══ */
.mandala{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.cell{display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:10px;line-height:1.35;border-radius:5px;padding:5px 3px;min-height:64px;
  word-break:break-all;transition:transform .12s,box-shadow .12s}
.clickable{cursor:pointer;position:relative}
.clickable:hover{transform:scale(1.07);box-shadow:0 4px 14px rgba(0,0,0,.22);z-index:10}
.c-center{background:#1565c0;color:white;font-weight:bold;font-size:10px;word-break:break-all}
.c-theme{font-weight:bold;color:white;font-size:10px}
.c-task{font-size:9px;color:#333}
.c-empty{background:#f5f5f5;opacity:.2;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#444;
  cursor:pointer;padding:3px 8px;border-radius:14px;transition:background .15s}
.leg-item:hover{background:#f0f0f0}
.leg-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}

/* ══ GENERATE STATE ══ */
.gen-box{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 24px;gap:18px;text-align:center;min-height:300px}
.gen-box h3{font-size:16px;color:#333}
.gen-box p{font-size:13px;color:#777;max-width:380px;line-height:1.7}
.btn-gen{background:linear-gradient(135deg,#1565c0,#6a1b9a);color:white;border:none;
  padding:14px 32px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit;
  transition:opacity .15s;box-shadow:0 3px 14px rgba(21,101,192,.35)}
.btn-gen:hover{opacity:.88}
.btn-gen.purple{background:linear-gradient(135deg,#7C3AED,#4f46e5);
  box-shadow:0 3px 14px rgba(124,58,237,.35)}
.pending-box{display:flex;flex-direction:column;align-items:center;
  padding:48px 24px;gap:16px;min-height:300px;justify-content:center}
.spinner{font-size:30px;animation:spin 1.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══ 4Q MATRIX ══ */
.mwrap{display:grid;
  grid-template-areas:". xt ." "yl mx yr" ". xb .";
  grid-template-columns:28px 1fr 28px;grid-template-rows:26px 1fr 26px;height:480px}
.ax-xt{grid-area:xt;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#444}
.ax-xb{grid-area:xb;display:flex;align-items:center;justify-content:center;font-size:11px;color:#888}
.ax-yl{grid-area:yl;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#444}
.ax-yr{grid-area:yr;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;font-size:11px;color:#888}
.mx{grid-area:mx;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border:2.5px solid #555;position:relative}
.mx::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#aaa;z-index:1}
.mx::after{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:#aaa;z-index:1}
.qd{padding:12px 11px 8px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:auto}
.ql{position:absolute;top:6px;right:8px;font-size:10px;font-weight:bold;opacity:.7;line-height:1}
.tl{background:#fce4e4}.tr{background:#e8f0fe}.bl{background:#f0fdf4}.br{background:#f9f9f9}
.qi{background:white;border-radius:7px;padding:6px 10px;font-size:12px;line-height:1.4;
  box-shadow:0 1px 4px rgba(0,0,0,.1);border-left:3px solid #ccc}
.tl .qi{border-left-color:#e53935}.tr .qi{border-left-color:#1e88e5}
.bl .qi{border-left-color:#43a047}.br .qi{border-left-color:#9e9e9e}
.qi.link{cursor:pointer;transition:transform .12s,box-shadow .12s}
.qi.link:hover{transform:translateX(3px);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.qi-sub{font-size:10px;color:#888;margin-top:2px}
.qi-tag{font-size:10px;font-weight:bold;color:#e53935;margin-top:2px}

/* ══ FLOW / GANTT ══ */
.chart-box{background:#fafafa;border-radius:10px;border:1px solid #eee;
  padding:16px 8px;overflow:auto;display:flex;justify-content:center;min-height:200px}
.chart-box .mermaid{min-width:660px}
.task-list{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.task-item{background:#f8f9fa;border-radius:10px;padding:14px 16px;border-left:4px solid #1565c0}
.task-item-title{font-size:14px;font-weight:bold;color:#1a1a1a;margin-bottom:6px}
.task-item-row{font-size:12px;color:#555;line-height:1.6;margin-top:3px}
.task-item-row b{color:#333}

/* ══ TOAST ══ */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#b71c1c;color:#fff;padding:12px 24px;border-radius:8px;
  font-size:13px;z-index:9999;display:none;max-width:90vw;text-align:center}
#toast.show{display:block;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="err-box" style="display:none;background:#c62828;color:white;padding:12px 16px;border-radius:8px;margin:12px;font-size:13px;font-family:monospace"></div>
<div id="app">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-title" onclick="go('home')">🧠 Kai Visualize</div>
    <div class="bc" id="bc"></div>
    <span id="srv-badge" class="srv-badge srv-ng">サーバー未接続</span>
  </div>

  <!-- ═══ HOME ═══ -->
  <section id="v-home" class="view active">
    <div class="home-hero">
      <div class="home-title">🧠 Kai Visualize</div>
      <div class="home-sub">テーマを入力するだけで<br>マンダラ → 4象限 → フロー図 → ガントチャートをAIが自動生成</div>
      <div class="home-btns">
        <button onclick="showNewModal()" class="btn-new">＋ 新規作成</button>
        <button onclick="go('history')" class="btn-outline">📋 全履歴</button>
        <a href="操作マニュアル.html" target="_blank" class="btn-outline">📗 マニュアル</a>
      </div>
    </div>
    <div id="home-sessions"></div>
  </section>

  <!-- ═══ HISTORY ═══ -->
  <section id="v-history" class="view">
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:22px">
        <button onclick="go('home')" class="btn">← ホームへ</button>
        <div class="card-title" style="margin:0">履歴一覧</div>
      </div>
      <div id="history-list"></div>
    </div>
  </section>

  <!-- ═══ MANDALA ═══ -->
  <section id="v-mandala" class="view">
    <div class="card">
      <div class="card-title" id="mandala-title">マンダラチャート</div>
      <div class="card-meta" id="mandala-meta">テーマセルをクリックして深掘り</div>
      <div id="mandala-body"></div>
      <div class="legend" id="mandala-legend"></div>
      <div class="toolbar">
        <button class="btn" onclick="go('home')">← ホームへ</button>
      </div>
    </div>
  </section>

  <!-- ═══ 4Q ═══ -->
  <section id="v-4q" class="view">
    <div class="card">
      <div class="card-title" id="q4-title">4象限マトリクス</div>
      <div class="card-meta" id="q4-meta"></div>
      <div id="q4-body"></div>
      <div class="toolbar">
        <button class="btn" onclick="go('mandala')">← マンダラに戻る</button>
        <button class="btn" id="q4-cp-btn" onclick="cpQ4()" style="display:none">📋 テキストコピー</button>
      </div>
    </div>
  </section>

  <!-- ═══ FLOW ═══ -->
  <section id="v-flow" class="view">
    <div class="card">
      <div class="card-title" id="flow-title">フロー図</div>
      <div class="card-meta" id="flow-meta"></div>
      <div id="flow-body"></div>
      <div class="toolbar">
        <button class="btn" onclick="go('4q',{ti:S.ti})">← 4象限に戻る</button>
        <button class="btn btn-primary" id="flow-to-gantt" onclick="go('gantt')" style="display:none">ガントチャートへ →</button>
        <button class="btn" id="flow-cp-btn" onclick="cpFlow()" style="display:none">📋 Mermaidコピー</button>
      </div>
    </div>
  </section>

  <!-- ═══ GANTT ═══ -->
  <section id="v-gantt" class="view">
    <div class="card">
      <div class="card-title" id="gantt-title">ガントチャート</div>
      <div class="card-meta" id="gantt-meta"></div>
      <div id="gantt-body"></div>
      <div id="gantt-tasks" style="display:none"></div>
      <div class="toolbar">
        <button class="btn" onclick="go('flow')">← フロー図に戻る</button>
        <button class="btn" id="gantt-cp-btn" onclick="cpGantt()" style="display:none">📋 Mermaidコピー</button>
      </div>
    </div>
  </section>

</div><!-- #app -->

<!-- New Session Modal -->
<div id="modal-new" style="display:none">
  <div class="modal-overlay" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">✨ 新規セッション作成</div>
      <div class="modal-sub">テーマを入力してください。<br>AIが8つのサブテーマと64のタスクを自動生成します（15〜25秒）。</div>
      <input id="new-theme-input" class="modal-input" placeholder="例：副業収入アップ、新規事業計画、健康管理、英語学習..."
        onkeydown="if(event.key==='Enter')createSession()" />
      <div class="modal-btns">
        <button onclick="closeModal()" class="modal-cancel">キャンセル</button>
        <button onclick="createSession()" class="modal-ok">マンダラを生成 →</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── エラー可視化 ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.className = ''; }, 5000);
}
window.onerror = function(msg, src, line) {
  const b = document.getElementById('err-box');
  if (b) { b.textContent = '⚠ JS Error: ' + msg + ' (line ' + line + ')'; b.style.display = 'block'; }
};

/* ── Mermaid ── */
let _mmdReady = false;
function initMermaid() {
  if (_mmdReady) return;
  if (typeof mermaid === 'undefined') return;
  try {
    mermaid.initialize({startOnLoad:false, theme:'default',
      flowchart:{curve:'basis'}, gantt:{barHeight:26,barGap:6,fontSize:13}});
    _mmdReady = true;
  } catch(e) {}
}

/* ── HTML escape ── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Date format ── */
function fmtDate(iso, full) {
  if (!iso) return '';
  const d = new Date(iso);
  if (full) return d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

/* ═══ SERVER STATE ═══ */
const API = 'http://localhost:3458';
let STATE = {generated:{'4q':{},flow:{},gantt:{}}, queue:[]};
let SESSION = null;
let TH = [];   // [{n, c, bg, bc}]
let TS = [];   // [[tasks...], ...]
let ONLINE = false;
let AUTO_MODE = false;
let _flowSrc = '', _ganttSrc = '';

function _sk(ti, tj) {
  return (tj !== null && tj !== undefined) ? `${ti}_${tj}` : String(ti);
}

function loadSession(sess) {
  SESSION = sess;
  TH = [];
  TS = [];
  STATE.generated = sess.generated || {'4q':{}, flow:{}, gantt:{}};
  if (sess.mandala && sess.mandala.themes) {
    sess.mandala.themes.forEach(t => {
      TH.push({n: t.name, c: t.c, bg: t.bg, bc: t.bc});
      TS.push(t.tasks || []);
    });
  }
}

async function initServer() {
  const badge = document.getElementById('srv-badge');
  badge.textContent = '⏳ 接続中...';
  try {
    const [keyR] = await Promise.all([fetch(API+'/has-api-key')]);
    AUTO_MODE = (await keyR.json()).ok;
    ONLINE = true;
    badge.className = 'srv-badge srv-ok';
    badge.textContent = '● 接続中' + (AUTO_MODE ? ' (AI自動)' : '');
    const es = new EventSource(API + '/events');
    es.addEventListener('content_ready', e => {
      const {type, session_id, key, content} = JSON.parse(e.data);
      if (!SESSION || session_id !== SESSION.id) return;
      if (type === 'mandala') {
        SESSION.mandala = content;
        loadSession(SESSION);
        if (S.view === 'mandala') renderMandala();
        return;
      }
      if (!STATE.generated[type]) STATE.generated[type] = {};
      STATE.generated[type][key] = content;
      onContentReady(type, key, content);
    });
    es.addEventListener('request_added', e => {
      const req = JSON.parse(e.data);
      if (!STATE.queue) STATE.queue = [];
      STATE.queue.push(req);
    });
    es.addEventListener('generate_error', e => {
      const {id, error} = JSON.parse(e.data);
      if (STATE.queue) STATE.queue = STATE.queue.filter(q => q.id !== id);
      const v = S.view;
      if (v === 'mandala') renderMandala();
      else if (v === '4q') render4Q(S.ti, S.tj);
      else if (v === 'flow') renderFlow(S.ti);
      else if (v === 'gantt') renderGantt(S.ti);
      showToast('生成エラー: ' + error);
    });
    es.onerror = () => { badge.className='srv-badge srv-ng'; badge.textContent='再接続中...'; };
  } catch(e) {
    ONLINE = false;
    badge.className = 'srv-badge srv-ng';
    badge.textContent = '✗ ' + (e.message || e.toString());
  }
}

function onContentReady(type, key, content) {
  const curKey = _sk(S.ti, S.tj);
  if (type === '4q' && S.view === '4q' && key === curKey) render4Q(S.ti, S.tj);
  else if (type === 'flow' && S.view === 'flow' && key === (S.flowKey || curKey)) {
    _flowSrc = content;
    renderMermaidView('flow-body', content);
    document.getElementById('flow-to-gantt').style.display = '';
    document.getElementById('flow-cp-btn').style.display = '';
  } else if (type === 'gantt' && S.view === 'gantt' && key === (S.flowKey || curKey)) {
    renderGantt(S.ti);
  }
}

/* ═══ NAVIGATION ═══ */
const S = {view:'home', ti:null, tj:null, flowCtx:null, flowKey:null};

function go(view, params={}) {
  Object.assign(S, params);
  S.view = view;
  if (view === 'mandala') { S.ti = null; S.tj = null; S.flowCtx = null; S.flowKey = null; }
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('v-'+view).classList.add('active');
  if (view === 'home') renderHome();
  else if (view === 'history') renderHistory();
  else if (view === 'mandala') renderMandala();
  else if (view === '4q') render4Q(S.ti, S.tj);
  else if (view === 'flow') renderFlow(S.ti);
  else if (view === 'gantt') renderGantt(S.ti);
  renderBC();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ═══ BREADCRUMB ═══ */
function renderBC() {
  const steps = [{lbl:'🏠', v:'home'}];
  if (S.view === 'history') {
    steps.push({lbl:'履歴一覧', v:'history'});
  } else if (SESSION && S.view !== 'home') {
    const sessLabel = SESSION.title || SESSION.theme;
    steps.push({lbl: sessLabel.length > 12 ? sessLabel.slice(0,12)+'…' : sessLabel, v:'mandala'});
    if (S.ti !== null && S.view !== 'mandala') {
      steps.push({lbl: TH[S.ti]?.n || '', v:'4q', ti:S.ti, tj:null});
      if (S.tj !== null && S.tj !== undefined)
        steps.push({lbl: (TS[S.ti]?.[S.tj] || '').slice(0,10), v:'4q', ti:S.ti, tj:S.tj});
      if (S.view === 'flow' || S.view === 'gantt') steps.push({lbl:'フロー図', v:'flow'});
      if (S.view === 'gantt') steps.push({lbl:'ガント', v:'gantt'});
    }
  }
  document.getElementById('bc').innerHTML = steps.map((s,i) => {
    const cur = i === steps.length-1;
    let oc = '';
    if (!cur) {
      if (s.v === 'home') oc = ` onclick="go('home')"`;
      else if (s.v === 'history') oc = ` onclick="go('history')"`;
      else if (s.v === 'mandala') oc = ` onclick="go('mandala')"`;
      else if (s.v === '4q') oc = ` onclick="go('4q',{ti:${s.ti},tj:${s.tj===null?'null':s.tj}})"`;
      else if (s.v === 'flow') oc = ` onclick="go('flow')"`;
    }
    return `${i?'<span class="bc-sep">›</span>':''}<span class="bc-btn${cur?' cur':''}"${oc}>${s.lbl}</span>`;
  }).join('');
}

/* ═══ HOME ═══ */
async function renderHome() {
  const el = document.getElementById('home-sessions');
  el.innerHTML = '<p style="color:#888;text-align:center;padding:30px">読み込み中...</p>';
  if (!ONLINE) {
    el.innerHTML = '<p style="color:#c62828;text-align:center;padding:30px">サーバーに接続できません。起動してブラウザを開く.vbs を実行してください。</p>';
    return;
  }
  try {
    const sessions = await fetch(`${API}/api/sessions`).then(r=>r.json());
    if (!sessions.length) {
      el.innerHTML = '<p style="color:#888;text-align:center;padding:40px 20px">セッションがありません。<br>「＋ 新規作成」でテーマを入力して始めましょう。</p>';
      return;
    }
    const recent = sessions.slice(0, 6);
    const moreCount = sessions.length - recent.length;
    el.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="home-section-label">最近のセッション</div>
        ${moreCount > 0 ? `<button class="btn-outline" style="font-size:12px;padding:6px 14px" onclick="go('history')">全${sessions.length}件 →</button>` : ''}

    el.innerHTML = '<p style="color:#c62828;text-align:center;padding:30px">読み込み失敗</p>';
  }
}

function _sessionCard(sess) {
  const p = sess.progress;
  const badges = [
    {k:'mandala',l:'マンダラ'},{k:'4q',l:'4象限'},{k:'flow',l:'フロー'},{k:'gantt',l:'ガント'}
  ].map(b=>`<span class="sc-badge ${p[b.k]?'done':'none'}">${p[b.k]?'✓ ':''} ${b.l}</span>`).join('');
  const showTheme = sess.title && sess.title !== sess.theme;
  return `<div class="session-card" onclick="openSession('${sess.id}')">
    <div class="sc-title">${esc(sess.title||sess.theme)}</div>
    ${showTheme ? `<div class="sc-theme">テーマ: ${esc(sess.theme)}</div>` : ''}
    <div class="sc-badges">${badges}</div>
    ${sess.memo ? `<div class="sc-memo">${esc(sess.memo)}</div>` : ''}
    <div class="sc-date">${fmtDate(sess.updatedAt)}</div>

}

/* ═══ HISTORY ═══ */
async function renderHistory() {
  const el = document.getElementById('history-list');
  el.innerHTML = '<p style="color:#888;text-align:center;padding:30px">読み込み中...</p>';

}

function _histItem(sess) {
  const p = sess.progress;
  const badges = [
    {k:'mandala',l:'マンダラ'},{k:'4q',l:'4象限'},{k:'flow',l:'フロー'},{k:'gantt',l:'ガント'}

        onclick="startEditMemo('${sess.id}')" data-memo="${esc(sess.memo||'')}"

function startRename(sid) {
  const titleEl = document.getElementById(`ht-${sid}`);
  const cur = titleEl.textContent;
  titleEl.outerHTML = `
    <div id="rename-wrap-${sid}" style="flex:1">
      <input class="inline-input" id="ri-${sid}" value="${esc(cur)}" onkeydown="if(event.key==='Enter')saveRename('${sid}');if(event.key==='Escape')renderHistory()" />
      <div class="inline-save-row">
        <button class="inline-btn save" onclick="saveRename('${sid}')">保存</button>
        <button class="inline-btn cancel" onclick="renderHistory()">キャンセル</button>

async function saveRename(sid) {
  const val = document.getElementById(`ri-${sid}`)?.value.trim();
  if (!val) return;
  await fetch(`${API}/api/sessions/${sid}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},

  renderHistory();
}

function startEditMemo(sid) {
  const memoEl = document.getElementById(`hm-${sid}`);
  const cur = memoEl.dataset.memo || '';
  memoEl.outerHTML = `
    <div id="memo-wrap-${sid}">
      <textarea class="inline-textarea" id="mti-${sid}" onkeydown="if(event.key==='Escape')renderHistory()">${esc(cur)}</textarea>
      <div class="inline-save-row">
        <button class="inline-btn save" onclick="saveMemo('${sid}')">保存</button>
        <button class="inline-btn cancel" onclick="renderHistory()">キャンセル</button>
      </div>
    </div>`;
  document.getElementById(`mti-${sid}`)?.focus();
}

async function saveMemo(sid) {
  const val = document.getElementById(`mti-${sid}`)?.value.trim() || '';
  await fetch(`${API}/api/sessions/${sid}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({memo: val})
  });
  if (SESSION && SESSION.id === sid) SESSION.memo = val;
  renderHistory();
}

async function deleteSession(sid, title) {
  if (!confirm(`「${title}」を削除しますか？\nこの操作は取り消せません。`)) return;
  await fetch(`${API}/api/sessions/${sid}`, {method:'DELETE'});
  if (SESSION && SESSION.id === sid) { SESSION = null; TH = []; TS = []; }
  renderHistory();
}

/* ═══ MANDALA ═══ */
function renderMandala() {
  if (!SESSION) { go('home'); return; }
  document.getElementById('mandala-title').textContent = (SESSION.title || SESSION.theme) + '　マンダラチャート';
  const body = document.getElementById('mandala-body');
  const legend = document.getElementById('mandala-legend');

  if (!SESSION.mandala) {
    legend.innerHTML = '';
    const pending = (STATE.queue||[]).find(q => q.type === 'mandala' && q.session_id === SESSION.id);
    if (pending) {
      body.innerHTML = `<div class="pending-box">
        <div class="spinner">⏳</div>
        <p style="font-size:14px;color:#555">AIがマンダラを生成中です...<br>8サブテーマ×8タスク=64項目 (15〜25秒)</p>
      </div>`;
    } else {
      body.innerHTML = `<div class="gen-box">
        <h3>🧠 ${esc(SESSION.theme)}</h3>
        <p>8つのサブテーマと64のタスクをAIが自動生成します。<br>生成には15〜25秒かかります。</p>
        <button class="btn-gen purple" onclick="requestMandala()">✨ マンダラを生成する</button>
      </div>`;
    }
    return;
  }
  buildMandalaGrid();
}

function buildMandalaGrid() {
  const themes = SESSION.mandala.themes;
  const G = Array.from({length:9}, () => Array(9).fill(null));
  G[4][4] = {t:'c'};
  [[3,3],[3,4],[3,5],[4,5],[5,5],[5,4],[5,3],[4,3]].forEach(([r,c],i) => G[r][c]={t:'th',i});
  [[0,0],[0,3],[0,6],[3,6],[6,6],[6,3],[6,0],[3,0]].forEach(([br,bc],i) => {
    G[br+1][bc+1] = {t:'tho',i};
    [[0,0],[0,1],[0,2],[1,2],[2,2],[2,1],[2,0],[1,0]].forEach(([dr,dc],j) => G[br+dr][bc+dc]={t:'tk',i,j});
  });
  const body = document.getElementById('mandala-body');
  const grid = document.createElement('div');
  grid.className = 'mandala';
  for (let r=0; r<9; r++) for (let c=0; c<9; c++) {
    const cell=G[r][c], d=document.createElement('div');
    d.className='cell';
    if (!cell) { d.classList.add('c-empty'); }
    else if (cell.t==='c') {
      d.classList.add('c-center');
      d.textContent = (SESSION.title||SESSION.theme).slice(0,12);
    } else if (cell.t==='th'||cell.t==='tho') {
      const th=themes[cell.i]; d.classList.add('c-theme','clickable');
      d.style.background=th.c;
      d.textContent = cell.t==='th' ? `${cell.i+1}. ${th.name}` : th.name;
      d.title = th.name + ' の4象限を見る';
      d.onclick=()=>go('4q',{ti:cell.i,tj:null});
    } else {
      const th=themes[cell.i]; d.classList.add('c-task','clickable');
      d.style.background=th.bg; d.style.border=`1px solid ${th.bc}`;
      const task = th.tasks[cell.j] || '';
      d.textContent = task;
      d.title = task + ' の詳細4象限';
      d.onclick=()=>go('4q',{ti:cell.i,tj:cell.j});
    }
    grid.appendChild(d);
  }
  body.innerHTML = '';
  body.appendChild(grid);
  body.insertAdjacentHTML('beforeend','<div style="margin-top:8px;font-size:12px;color:#999;text-align:center">💡 色のついたセルをクリックすると4象限マトリクスに進みます</div>');

  const lg = document.getElementById('mandala-legend');
  lg.innerHTML = '';
  themes.forEach((th,i) => {
    const el=document.createElement('div'); el.className='leg-item';
    el.innerHTML=`<div class="leg-dot" style="background:${th.c}"></div><span>${i+1}. ${th.name}</span>`;
    el.onclick=()=>go('4q',{ti:i,tj:null}); lg.appendChild(el);
  });
}

async function requestMandala() {
  if (!ONLINE || !SESSION) return;
  await fetch(`${API}/request`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({type:'mandala', session_id:SESSION.id, context:SESSION.theme})});
  renderMandala();
}

/* ═══ REQUEST ═══ */
async function requestGenerate(type, ti, context, tj, flowKey) {
  if (!ONLINE) { alert('サーバーが起動していません。'); return; }
  if (!SESSION) { alert('セッションが選択されていません。'); return; }
  const body = {type, session_id:SESSION.id, theme_id:ti, context: context || TH[ti]?.n || ''};
  if (tj !== null && tj !== undefined) body.task_id = tj;
  if (flowKey) body.flow_key = flowKey;
  await fetch(`${API}/request`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (type === '4q') render4Q(ti, tj);
  else if (type === 'flow') renderFlow(ti);
  else if (type === 'gantt') renderGantt(ti);
}

function goFlow(el) {
  const ti = parseInt(el.dataset.ti);
  const tj = el.dataset.tj === 'null' ? null : parseInt(el.dataset.tj);
  go('flow', {ti, tj, flowCtx: el.dataset.fctx, flowKey: el.dataset.fkey});
}

function _pendingFor(type, ti, tj, flowKey) {
  if (flowKey) return (STATE.queue||[]).find(q => q.type === type && q.flow_key === flowKey);
  const key = _sk(ti, tj);
  return (STATE.queue||[]).find(q => {
    const qk = (q.task_id !== null && q.task_id !== undefined) ? `${q.theme_id}_${q.task_id}` : String(q.theme_id);
    return q.type === type && qk === key;
  });
}

function _pendingBox(type, ti, context, tj, flowKey) {
  const pending = _pendingFor(type, ti, tj, flowKey);
  const label = {'4q':'4象限マトリクス', flow:'フロー図', gantt:'ガントチャート'}[type];
  const tjArg = (tj !== null && tj !== undefined) ? tj : 'null';
  const fkArg = flowKey ? `,'${flowKey}'` : '';
  if (pending) {
    return `<div class="pending-box">
      <div class="spinner">⏳</div>
      <p style="font-size:14px;color:#555">${AUTO_MODE ? 'AIが生成中です... (10〜20秒)' : 'リクエスト送信済み — 生成待ちです'}</p>
    </div>`;
  }
  const ctxEsc = context.replace(/'/g,"\\'");
  return `<div class="gen-box">
    <h3>${esc(context)}　${label}</h3>
    <p>まだ生成されていません。ボタンをクリックするとAIが生成します。</p>
    <button class="btn-gen" onclick="requestGenerate('${type}',${ti},'${ctxEsc}',${tjArg}${fkArg})">
      ✨ ${label}を生成する
    </button>
  </div>`;
}

/* ═══ 4Q RENDER ═══ */
function render4Q(ti, tj) {
  if (!SESSION || !TH.length) return;
  const th = TH[ti];
  const taskName = (tj !== null && tj !== undefined) ? (TS[ti]?.[tj] || '') : null;
  const context = taskName || th.n;
  const titlePrefix = taskName ? `${th.n} › ${taskName}` : `テーマ${ti+1}: ${th.n}`;
  document.getElementById('q4-title').textContent = titlePrefix + '　4象限マトリクス';
  const body = document.getElementById('q4-body');
  const key = _sk(ti, tj);
  const data = STATE?.generated?.['4q']?.[key];
  if (!data) {
    document.getElementById('q4-meta').textContent = '';
    document.getElementById('q4-cp-btn').style.display = 'none';
    body.innerHTML = _pendingBox('4q', ti, context, tj);
    return;
  }
  document.getElementById('q4-cp-btn').style.display = '';
  document.getElementById('q4-meta').textContent = `Y軸：${data.axis?.y||''}（高→低）　X軸：${data.axis?.x||''}（低→高）`;
  const tjVal = (tj !== null && tj !== undefined) ? tj : 'null';
  const ri = (items, quad) => (items||[]).map((item, idx) => {
    const fKey = `f_${ti}_${tjVal}_${quad}_${idx}`;
    const fCtx = (item.t||'').replace(/"/g,'&quot;');
    return `<div class="qi link"
      data-fkey="${fKey}" data-fctx="${fCtx}" data-ti="${ti}" data-tj="${tjVal}"
      onclick="goFlow(this)">
      ${esc(item.t||'')}
      <div class="qi-sub">${esc(item.s||'')}</div>
      <div class="qi-tag">▶ フロー図を生成</div>
    </div>`;
  }).join('');
  body.innerHTML = `
    <div class="mwrap">
      <div class="ax-xt">← ${esc(data.axis?.x||'')} 低</div>
      <div class="ax-yl">↑ ${esc(data.axis?.y||'')} 高</div>
      <div class="mx">
        <div class="qd tl"><div class="ql">${esc(data.tl?.lbl||'')}</div>${ri(data.tl?.items,'tl')}</div>
        <div class="qd tr"><div class="ql">${esc(data.tr?.lbl||'')}</div>${ri(data.tr?.items,'tr')}</div>
        <div class="qd bl"><div class="ql">${esc(data.bl?.lbl||'')}</div>${ri(data.bl?.items,'bl')}</div>
        <div class="qd br"><div class="ql">${esc(data.br?.lbl||'')}</div>${ri(data.br?.items,'br')}</div>
      </div>
      <div class="ax-yr">低 ↓</div>
      <div class="ax-xb">高 →</div>
    </div>
    <div style="margin-top:8px;font-size:12px;color:#888">💡 各カードをクリックするとフロー図を生成します</div>`;
}

/* ═══ FLOW RENDER ═══ */
function renderFlow(ti) {
  if (!SESSION || !TH.length) return;
  const th = TH[ti];
  const taskName = (S.tj !== null && S.tj !== undefined) ? (TS[ti]?.[S.tj]||'') : null;
  const context = S.flowCtx || taskName || th.n;
  const key = S.flowKey || _sk(ti, S.tj);
  document.getElementById('flow-title').textContent = `${esc(context)}　フロー図`;
  document.getElementById('flow-meta').textContent = S.flowCtx
    ? `${th.n}${taskName?' › '+taskName:''} › ${S.flowCtx} の実行フロー`
    : (taskName ? `${th.n} › ${taskName} の実行フロー` : `${th.n} の実行フロー`);
  const src = STATE?.generated?.flow?.[key];
  const body = document.getElementById('flow-body');
  if (!src) {
    document.getElementById('flow-to-gantt').style.display = 'none';
    document.getElementById('flow-cp-btn').style.display = 'none';
    body.innerHTML = _pendingBox('flow', ti, context, S.tj, key);
    return;
  }
  _flowSrc = src;
  document.getElementById('flow-to-gantt').style.display = '';
  document.getElementById('flow-cp-btn').style.display = '';
  renderMermaidView('flow-body', src);
}

/* ═══ GANTT RENDER ═══ */
function renderGantt(ti) {
  if (!SESSION || !TH.length) return;
  const th = TH[ti];
  const taskName = (S.tj !== null && S.tj !== undefined) ? (TS[ti]?.[S.tj]||'') : null;
  const context = S.flowCtx || taskName || th.n;
  const key = S.flowKey || _sk(ti, S.tj);
  document.getElementById('gantt-title').textContent = `${esc(context)}　ガントチャート`;
  document.getElementById('gantt-meta').textContent = `${esc(context)} の実行スケジュール`;
  const raw = STATE?.generated?.gantt?.[key];
  const body = document.getElementById('gantt-body');
  const taskDiv = document.getElementById('gantt-tasks');
  if (!raw) {
    document.getElementById('gantt-cp-btn').style.display = 'none';
    taskDiv.style.display = 'none';
    body.innerHTML = _pendingBox('gantt', ti, context, S.tj, key);
    return;
  }
  const mermaidSrc = (typeof raw === 'object' && raw.mermaid) ? raw.mermaid : raw;
  const tasks = (typeof raw === 'object' && Array.isArray(raw.tasks)) ? raw.tasks : [];
  _ganttSrc = mermaidSrc;
  document.getElementById('gantt-cp-btn').style.display = '';
  renderMermaidView('gantt-body', mermaidSrc);
  if (tasks.length > 0) {
    taskDiv.style.display = '';
    taskDiv.innerHTML = `<div class="task-list">${tasks.map((t,i) => `
      <div class="task-item">
        <div class="task-item-title">タスク${i+1}：${esc(t.title||'')}</div>
        <div class="task-item-row"><b>概要：</b>${esc(t.summary||'')}</div>
        <div class="task-item-row"><b>注意点：</b>${esc(t.notes||'')}</div>
      </div>`).join('')}</div>`;
  } else {
    taskDiv.style.display = 'none';
  }
}

/* ═══ MERMAID ═══ */
function renderMermaidView(containerId, code) {
  initMermaid();
  const container = document.getElementById(containerId);
  const box = document.createElement('div'); box.className = 'chart-box';
  const pre = document.createElement('pre'); pre.className = 'mermaid'; pre.textContent = code;
  box.appendChild(pre); container.innerHTML = ''; container.appendChild(box);
  if (_mmdReady) requestAnimationFrame(() => mermaid.run({nodes:[pre]}));
}

/* ═══ COPY ═══ */
function doCp(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    if (!btn) return;
    const o=btn.textContent; btn.textContent='✅ コピー完了';
    setTimeout(()=>btn.textContent=o, 2000);
  }).catch(() => {
    const ta=document.createElement('textarea'); ta.value=text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  });
}
function cpQ4() {
  const d=STATE?.generated?.['4q']?.[_sk(S.ti,S.tj)];
  if (!d) return;
  const f=k=>`【${d[k].lbl}】\n${(d[k].items||[]).map(i=>'- '+i.t).join('\n')}`;
  doCp([f('tl'),f('tr'),f('bl'),f('br')].join('\n\n'), event.currentTarget);
}
function cpFlow() { doCp(_flowSrc, event.currentTarget); }
function cpGantt() { doCp(_ganttSrc, event.currentTarget); }

/* ═══ INIT ═══ */
renderBC();
initServer().then(() => renderHome());
</script>
