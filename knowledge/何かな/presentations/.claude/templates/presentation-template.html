<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ — プレゼンテーション</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #FFFFFF;
    color: #1A1A1A;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(32px, 5vh, 72px) clamp(40px, 7vw, 120px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease;
    overflow-y: auto;
  }
  .slide.active { opacity: 1; visibility: visible; pointer-events: auto; }
  .slide h1 {
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 900;
    line-height: 1.15;
    background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: clamp(16px, 3vh, 32px);
  }
  .slide h2 {
    font-size: clamp(28px, 4.2vw, 48px);
    font-weight: 700;
    color: #1E40AF;
    margin-bottom: clamp(18px, 3vh, 32px);
    padding-bottom: 12px;
    border-bottom: 4px solid #1E40AF;
    line-height: 1.25;
  }
  .slide p {
    font-size: clamp(18px, 2.2vw, 28px);
    line-height: 1.7;
    margin-bottom: clamp(12px, 1.6vh, 18px);
  }
  .slide ul {
    padding-left: clamp(20px, 3vw, 36px);
    font-size: clamp(18px, 2.2vw, 28px);
  }
  .slide ul li {
    line-height: 1.7;
    margin-bottom: clamp(10px, 1.4vh, 16px);
  }
  .slide strong { color: #1E40AF; font-weight: 700; }

  /* キッカー（小ラベル） */
  .kicker {
    display: inline-block;
    font-size: clamp(12px, 1.4vw, 16px);
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #3B82F6;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  /* アクセントバー */
  .accent-bar {
    width: clamp(60px, 8vw, 120px);
    height: 4px;
    background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
    margin-bottom: 20px;
    border-radius: 2px;
  }
  /* 巨大な数値 */
  .hero-number {
    font-size: clamp(72px, 12vw, 160px);
    font-weight: 900;
    background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .hero-label {
    font-size: clamp(16px, 2vw, 24px);
    color: #475569;
    margin-top: 12px;
    font-weight: 500;
  }
  /* KPI横並び */
  .stat-row {
    display: flex;
    gap: clamp(16px, 2vw, 32px);
    flex-wrap: wrap;
    margin-top: clamp(20px, 3vh, 32px);
  }
  .stat-card {
    flex: 1 1 180px;
    background: #F0F5FF;
    border-left: 4px solid #1E40AF;
    border-radius: 8px;
    padding: clamp(16px, 2.4vh, 28px) clamp(20px, 2.6vw, 32px);
  }
  .stat-card .num {
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 900;
    color: #1E40AF;
    line-height: 1;
  }
  .stat-card .lab {
    font-size: clamp(14px, 1.6vw, 18px);
    color: #475569;
    margin-top: 8px;
  }
  /* カードグリッド */
  .card-grid {
    display: grid;
    gap: clamp(16px, 2vw, 28px);
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    margin-top: clamp(16px, 2.4vh, 28px);
  }
  .card {
    background: #F0F5FF;
    border-radius: 12px;
    padding: clamp(18px, 2.6vh, 32px) clamp(20px, 2.6vw, 32px);
    box-shadow: 0 2px 8px rgba(30, 64, 175, 0.08);
    border-top: 4px solid #3B82F6;
  }
  .card .card-title {
    font-size: clamp(18px, 2.2vw, 26px);
    font-weight: 700;
    color: #1E40AF;
    margin-bottom: 8px;
  }
  .card .card-body {
    font-size: clamp(14px, 1.8vw, 20px);
    color: #1A1A1A;
    line-height: 1.6;
  }
  /* 2カラム */
  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(24px, 3vw, 48px);
    margin-top: clamp(16px, 2.4vh, 24px);
    align-items: start;
  }
  .two-col .col {
    background: #F0F5FF;
    border-radius: 12px;
    padding: clamp(18px, 2.6vh, 28px);
  }
  .two-col .col-title {
    font-size: clamp(18px, 2.2vw, 26px);
    font-weight: 700;
    color: #1E40AF;
    margin-bottom: 12px;
  }
  /* 横棒グラフ（HTML+CSSのみ、SVGは使わない） */
  .bar-chart { margin-top: clamp(16px, 2.4vh, 28px); }
  .bar-row {
    display: grid;
    grid-template-columns: clamp(100px, 16vw, 180px) 1fr clamp(60px, 8vw, 100px);
    align-items: center;
    gap: 16px;
    margin-bottom: clamp(10px, 1.4vh, 16px);
    font-size: clamp(14px, 1.8vw, 20px);
  }
  .bar-row .bar-label { font-weight: 500; }
  .bar-row .bar-track { background: #E5ECFF; border-radius: 4px; height: clamp(14px, 2vh, 22px); overflow: hidden; }
  .bar-row .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #3B82F6 0%, #1E40AF 100%);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .bar-row .bar-value { font-weight: 700; color: #1E40AF; text-align: right; }
  /* タイムライン */
  .timeline {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: clamp(8px, 1vw, 16px);
    margin-top: clamp(20px, 3vh, 36px);
    position: relative;
  }
  .timeline::before {
    content: "";
    position: absolute;
    top: 14px;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #1E40AF 0%, #3B82F6 100%);
    z-index: 0;
  }
  .timeline .tl-item {
    position: relative;
    padding-top: 36px;
    z-index: 1;
  }
  .timeline .tl-item::before {
    content: "";
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 18px; height: 18px;
    background: #1E40AF;
    border: 3px solid #FFFFFF;
    border-radius: 50%;
    box-shadow: 0 0 0 2px #1E40AF;
  }
  .timeline .tl-date { font-weight: 700; color: #1E40AF; font-size: clamp(14px, 1.8vw, 20px); }
  .timeline .tl-text { font-size: clamp(13px, 1.6vw, 18px); color: #1A1A1A; margin-top: 6px; line-height: 1.5; }
  /* 引用 */
  .quote {
    padding: clamp(20px, 3vh, 36px) clamp(20px, 3vw, 40px);
    border-left: 6px solid;
    border-image: linear-gradient(180deg, #1E40AF, #3B82F6) 1;
    background: #F0F5FF;
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 500;
    line-height: 1.5;
    font-style: italic;
    color: #1E40AF;
    margin: clamp(20px, 3vh, 36px) 0;
  }
  .quote .cite {
    display: block;
    font-style: normal;
    font-size: clamp(14px, 1.6vw, 18px);
    color: #475569;
    margin-top: 16px;
    font-weight: 500;
  }
  /* アイコンリスト */
  .icon-list {
    list-style: none;
    padding: 0;
    margin-top: clamp(16px, 2.4vh, 24px);
  }
  .icon-list li {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: clamp(10px, 1.4vh, 16px) 0;
    font-size: clamp(18px, 2.2vw, 26px);
    line-height: 1.5;
  }
  .icon-list li .ico { font-size: 1.6em; flex-shrink: 0; }
  /* 表（最低限） */
  .slide table {
    font-size: clamp(14px, 1.8vw, 22px);
    border-collapse: collapse;
    margin-top: clamp(16px, 2.4vh, 24px);
    width: 100%;
  }
  .slide th, .slide td {
    padding: clamp(10px, 1.2vh, 14px) clamp(14px, 1.6vw, 20px);
    border-bottom: 1px solid #E5ECFF;
    text-align: left;
  }
  .slide th { background: #1E40AF; color: white; font-weight: 700; }
  .slide td { color: #1A1A1A; }
  .slide tr:nth-child(even) td { background: #F8FAFF; }
  /* リンク */
  .slide a { color: #1E40AF; text-decoration: underline; }
  /* プログレス・ページ番号 */
  .progress {
    position: fixed; top: 0; left: 0;
    height: 4px;
    background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
    transition: width 0.3s ease;
    z-index: 1000;
  }
  .page-num {
    position: fixed; bottom: 24px; right: 32px;
    font-size: clamp(12px, 1.4vw, 16px);
    color: #94A3B8;
    z-index: 1000;
    font-weight: 500;
  }
  /* タイトルスライド */
  .slide.title-slide {
    background: linear-gradient(135deg, #3B82F6 0%, #1E3A8A 100%);
    color: white;
    text-align: center;
    align-items: center;
  }
  .slide.title-slide h1 {
    -webkit-text-fill-color: white;
    background: none;
    background-clip: unset;
    -webkit-background-clip: unset;
    font-size: clamp(44px, 7.5vw, 88px);
  }
  .slide.title-slide .subtitle {
    font-size: clamp(18px, 2.6vw, 32px);
    margin-top: clamp(12px, 2vh, 20px);
    opacity: 0.92;
    font-weight: 400;
  }
  .slide.title-slide .kicker { color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="progress" id="progress"></div>

  <!-- ===== SLIDES_PLACEHOLDER ===== -->
  <!-- slide-maker エージェントは Edit ツールで、このコメント1行を            -->
  <!-- 実際の <section class="slide">...</section> 群（基本7枚）に置換する。 -->
  <!-- 上の HTMLコメント全体（"===== SLIDES_PLACEHOLDER ====="）を         -->
  <!-- old_string として Edit を呼ぶこと。                                    -->
  <!-- ===== END SLIDES_PLACEHOLDER ===== -->

  <div class="page-num"><span id="cur">1</span> / <span id="total">7</span></div>

<script>
  const slides = document.querySelectorAll('.slide');
  let cur = 0;
  document.getElementById('total').textContent = slides.length;
  function show(i) {
    slides.forEach(s => s.classList.remove('active'));
    slides[i].classList.add('active');
    document.getElementById('cur').textContent = i + 1;
    document.getElementById('progress').style.width = ((i+1)/slides.length*100) + '%';
  }
  function next() { if (cur < slides.length-1) { cur++; show(cur); } }
  function prev() { if (cur > 0) { cur--; show(cur); } }
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { next(); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
  });
  document.addEventListener('click', e => {
    if (e.target.closest('a, button, input, textarea, select')) return;
    if (window.getSelection && window.getSelection().toString()) return;
    const x = e.clientX;
    const w = window.innerWidth;
    if (x > w / 2) next(); else prev();
  });
  show(0);
</script>
</body>
</html>
