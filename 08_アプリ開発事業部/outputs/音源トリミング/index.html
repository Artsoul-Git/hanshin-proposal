<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音源トリミング</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Yu Gothic UI', sans-serif;
  background: #0f1117;
  color: #c9d1d9;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

header {
  padding: 10px 18px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

header h1 { font-size: 15px; font-weight: 600; color: #58a6ff; white-space: nowrap; }

.btn {
  padding: 5px 13px;
  border-radius: 6px;
  border: 1px solid #30363d;
  background: #21262d;
  color: #c9d1d9;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.12s, border-color 0.12s;
  white-space: nowrap;
}
.btn:hover { background: #30363d; border-color: #58a6ff; }
.btn:active { opacity: 0.8; }
.btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
.btn.primary:hover { background: #388bfd; }
.btn.success { background: #238636; border-color: #238636; color: #fff; }
.btn.success:hover { background: #2ea043; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.file-name {
  font-size: 12px;
  color: #8b949e;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 260px;
}

#duration-display {
  font-size: 12px;
  color: #484f58;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
}

/* Drop zone */
#drop-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.15s;
}
#drop-zone.drag-over { background: rgba(88,166,255,0.05); }
#drop-zone .drop-icon { font-size: 52px; line-height: 1; }
#drop-zone .drop-main { font-size: 18px; color: #c9d1d9; font-weight: 500; }
#drop-zone .drop-sub { font-size: 13px; color: #8b949e; }
#drop-zone .drop-formats { font-size: 11px; color: #484f58; margin-top: 6px; }
#drop-zone .drop-dashed {
  border: 2px dashed #30363d;
  border-radius: 14px;
  padding: 48px 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  transition: border-color 0.15s;
}
#drop-zone.drag-over .drop-dashed { border-color: #58a6ff; }

/* Editor */
#editor {
  flex: 1;
  display: none;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* Waveform */
.waveform-wrap {
  flex: 1;
  min-height: 0;
  position: relative;
  background: #0d1117;
  overflow: hidden;
}

#waveform {
  display: block;
  width: 100%;
  height: 100%;
  cursor: crosshair;
}

/* Timeline strip */
.timeline-strip {
  height: 22px;
  background: #0d1117;
  border-top: 1px solid #21262d;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
#timeline-canvas { display: block; width: 100%; height: 100%; }

/* Controls bar */
.controls {
  background: #161b22;
  border-top: 1px solid #30363d;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.playhead-time {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: #f0e03a;
  min-width: 70px;
}

.sep { width: 1px; height: 22px; background: #30363d; flex-shrink: 0; }

.trim-inputs {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.trim-inputs label { color: #8b949e; white-space: nowrap; }
.trim-input {
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 4px;
  color: #c9d1d9;
  padding: 3px 7px;
  width: 92px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
}
.trim-input:focus { outline: none; border-color: #58a6ff; }

.zoom-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
}
.zoom-btn {
  width: 26px; height: 26px;
  border-radius: 4px;
  border: 1px solid #30363d;
  background: #21262d;
  color: #c9d1d9;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.zoom-btn:hover { background: #30363d; }
#zoom-label { font-size: 11px; color: #8b949e; min-width: 32px; text-align: center; }

.spacer { flex: 1; min-width: 0; }

.trim-len { font-size: 11px; color: #484f58; font-family: 'Courier New', monospace; white-space: nowrap; }

kbd {
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 10px;
  font-family: monospace;
}
.shortcuts { font-size: 11px; color: #484f58; white-space: nowrap; }

/* Loading overlay */
#loading {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  z-index: 100;
}
#loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid #30363d;
  border-top-color: #58a6ff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading p { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>🎵 音源トリミング</h1>
  <button class="btn" id="open-btn">ファイルを開く</button>
  <input type="file" id="file-input" accept="audio/*" style="display:none">
  <span class="file-name" id="file-name"></span>
  <span id="duration-display"></span>
</header>

<div id="drop-zone">
  <div class="drop-dashed">
    <div class="drop-icon">🎧</div>
    <div class="drop-main">MP3・WAV・M4A などをここにドロップ</div>
    <div class="drop-sub">または「ファイルを開く」をクリック</div>
    <div class="drop-formats">対応形式：MP3 / WAV / M4A / OGG / FLAC / AAC など（ブラウザ依存）</div>
  </div>
</div>

<div id="editor">
  <div class="waveform-wrap" id="waveform-wrap">
    <canvas id="waveform"></canvas>
  </div>
  <div class="timeline-strip">
    <canvas id="timeline-canvas"></canvas>
  </div>
  <div class="controls">
    <button class="btn primary" id="play-btn">▶ 再生</button>
    <button class="btn" id="play-trim-btn">✂ トリム再生</button>
    <button class="btn" id="stop-btn">■ 停止</button>
    <span class="playhead-time" id="playhead-time">0:00.000</span>

    <div class="sep"></div>

    <div class="trim-inputs">
      <label>開始</label>
      <input class="trim-input" id="start-input" type="text" placeholder="0:00.000">
      <label>終了</label>
      <input class="trim-input" id="end-input" type="text" placeholder="0:00.000">
    </div>
    <span class="trim-len" id="trim-len"></span>

    <div class="sep"></div>

    <button class="btn" id="sel-all-btn">全選択</button>

    <div class="zoom-wrap">
      <button class="zoom-btn" id="zoom-out-btn">−</button>
      <span id="zoom-label">×1</span>
      <button class="zoom-btn" id="zoom-in-btn">＋</button>
    </div>

    <div class="spacer"></div>

    <span class="shortcuts"><kbd>Space</kbd> 再生/停止 &nbsp;<kbd>A</kbd> 全選択 &nbsp;<kbd>Ctrl+スクロール</kbd> ズーム</span>

    <div class="sep"></div>

    <button class="btn success" id="export-btn">⬇ WAVで書き出し</button>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <p id="loading-msg">読み込み中...</p>
</div>

<script>
// ─── Constants ───────────────────────────────────────────────
const HANDLE_HIT = 10; // px
const COLORS = {
  bg: '#0d1117',
  waveOff: '#1d3a5c',
  waveOn: '#4a9eff',
  selFill: 'rgba(74,158,255,0.12)',
  maskFill: 'rgba(0,0,0,0.52)',
  handleLine: '#ff6b6b',
  handleLineHover: '#ff8c69',
  handleFill: '#ff6b6b',
  handleFillHover: '#ff9070',
  playhead: '#f0e03a',
  grid: '#1e2433',
  gridText: '#484f58',
  timeline: '#161b22',
  timelineText: '#5c6370',
  timelineTick: '#2a2d40',
};

// ─── State ───────────────────────────────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let audioBuf = null;
let fileName = '';

let trimStart = 0;
let trimEnd = 0;
let zoom = 1;        // 1 = full view
let scrollSec = 0;   // view start in seconds

let playSource = null;
let isPlaying = false;
let playStartAt = 0; // audioCtx.currentTime when play started
let playFrom = 0;    // audio offset where play started
let playTo = 0;
let animId = null;
let headTime = 0;    // current playhead position (seconds)

// Peaks cache
let peakData = null; // Array of { mins, maxs } per channel

// Interaction
let drag = null;     // null | { type, ... }
let hoverHandle = null; // null | 'start' | 'end'

// ─── DOM ─────────────────────────────────────────────────────
const dropZone   = document.getElementById('drop-zone');
const editorEl   = document.getElementById('editor');
const fileInput  = document.getElementById('file-input');
const waveCanvas = document.getElementById('waveform');
const wrapEl     = document.getElementById('waveform-wrap');
const tlCanvas   = document.getElementById('timeline-canvas');
const loadingEl  = document.getElementById('loading');
const loadingMsg = document.getElementById('loading-msg');

const playBtn      = document.getElementById('play-btn');
const playTrimBtn  = document.getElementById('play-trim-btn');
const stopBtn      = document.getElementById('stop-btn');
const playheadTime = document.getElementById('playhead-time');
const startInput   = document.getElementById('start-input');
const endInput     = document.getElementById('end-input');
const trimLenEl    = document.getElementById('trim-len');
const selAllBtn    = document.getElementById('sel-all-btn');
const zoomInBtn    = document.getElementById('zoom-in-btn');
const zoomOutBtn   = document.getElementById('zoom-out-btn');
const zoomLabel    = document.getElementById('zoom-label');
const exportBtn    = document.getElementById('export-btn');
const fileNameEl   = document.getElementById('file-name');
const durationEl   = document.getElementById('duration-display');

const wCtx = waveCanvas.getContext('2d');
const tCtx = tlCanvas.getContext('2d');

// ─── File loading ─────────────────────────────────────────────
document.getElementById('open-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
dropZone.addEventListener('click', () => fileInput.click());

async function loadFile(file) {
  showLoading('デコード中...');
  fileName = file.name;

  if (!audioCtx) audioCtx = new AC();
  let arrayBuf;
  try {
    arrayBuf = await file.arrayBuffer();
  } catch(e) {
    hideLoading();
    alert('ファイルの読み込みに失敗しました: ' + e.message);
    return;
  }

  try {
    audioBuf = await audioCtx.decodeAudioData(arrayBuf);
  } catch(e) {
    hideLoading();
    alert('デコードに失敗しました。対応していない形式の可能性があります。\n' + e.message);
    return;
  }

  stopPlayback();
  trimStart = 0;
  trimEnd = audioBuf.duration;
  zoom = 1;
  scrollSec = 0;
  headTime = 0;

  showLoading('波形を生成中...');
  await new Promise(r => setTimeout(r, 10)); // yield to render loading
  peakData = computePeaks(audioBuf, 512);

  fileNameEl.textContent = fileName;
  durationEl.textContent = '全長 ' + fmtTime(audioBuf.duration);

  dropZone.style.display = 'none';
  editorEl.style.display = 'flex';

  resizeCanvases();
  updateInputs();
  draw();
  hideLoading();
}

function showLoading(msg) {
  loadingMsg.textContent = msg;
  loadingEl.style.display = 'flex';
}
function hideLoading() {
  loadingEl.style.display = 'none';
}

// ─── Peaks ───────────────────────────────────────────────────
function computePeaks(buf, resolution) {
  const ch = buf.numberOfChannels;
  const totalSamples = buf.length;
  const numBuckets = Math.ceil(totalSamples / resolution);
  const channels = [];

  for (let c = 0; c < ch; c++) {
    const data = buf.getChannelData(c);
    const mins = new Float32Array(numBuckets);
    const maxs = new Float32Array(numBuckets);
    for (let i = 0; i < numBuckets; i++) {
      const s = i * resolution;
      const e = Math.min(s + resolution, totalSamples);
      let mn = 0, mx = 0;
      for (let j = s; j < e; j++) {
        if (data[j] < mn) mn = data[j];
        if (data[j] > mx) mx = data[j];
      }
      mins[i] = mn;
      maxs[i] = mx;
    }
    channels.push({ mins, maxs });
  }
  return { channels, resolution, totalSamples };
}

// ─── Canvas helpers ──────────────────────────────────────────
const dpr = window.devicePixelRatio || 1;

function resizeCanvases() {
  const wr = wrapEl.getBoundingClientRect();
  waveCanvas.width  = wr.width * dpr;
  waveCanvas.height = wr.height * dpr;
  waveCanvas.style.width  = wr.width + 'px';
  waveCanvas.style.height = wr.height + 'px';

  const tr = tlCanvas.parentElement.getBoundingClientRect();
  tlCanvas.width  = tr.width * dpr;
  tlCanvas.height = tr.height * dpr;
  tlCanvas.style.width  = tr.width + 'px';
  tlCanvas.style.height = tr.height + 'px';
}

new ResizeObserver(() => { if (audioBuf) { resizeCanvases(); draw(); } }).observe(wrapEl);

function wW() { return waveCanvas.width / dpr; }
function wH() { return waveCanvas.height / dpr; }

function dur() { return audioBuf ? audioBuf.duration : 0; }
function viewDur() { return dur() / zoom; }

function secToX(sec) { return ((sec - scrollSec) / viewDur()) * wW(); }
function xToSec(x) { return scrollSec + (x / wW()) * viewDur(); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function clampSec(t) { return clamp(t, 0, dur()); }

// ─── Draw ─────────────────────────────────────────────────────
function draw() {
  drawWave();
  drawTimeline();
}

function drawWave() {
  if (!audioBuf || !peakData) return;
  const W = waveCanvas.width, H = waveCanvas.height;
  const w = W / dpr, h = H / dpr;

  wCtx.save();
  wCtx.scale(dpr, dpr);

  // Background
  wCtx.fillStyle = COLORS.bg;
  wCtx.fillRect(0, 0, w, h);

  const numCh = audioBuf.numberOfChannels;
  const chH = h / numCh;

  for (let c = 0; c < numCh; c++) {
    const { mins, maxs } = peakData.channels[c];
    const resolution = peakData.resolution;
    const sampleRate = audioBuf.sampleRate;
    const yCenter = chH * c + chH / 2;
    const amp = chH / 2 - 6;

    const startSample = scrollSec * sampleRate;
    const samplesPerPx = (viewDur() * sampleRate) / w;

    for (let px = 0; px < w; px++) {
      const sSample = startSample + px * samplesPerPx;
      const eSample = sSample + samplesPerPx;

      const b0 = Math.floor(sSample / resolution);
      const b1 = Math.ceil(eSample / resolution);

      let mn = 0, mx = 0;
      for (let b = b0; b <= b1 && b < maxs.length; b++) {
        if (mins[b] < mn) mn = mins[b];
        if (maxs[b] > mx) mx = maxs[b];
      }

      const sec = xToSec(px);
      const inTrim = sec >= trimStart && sec <= trimEnd;
      wCtx.fillStyle = inTrim ? COLORS.waveOn : COLORS.waveOff;

      const yTop = yCenter - mx * amp;
      const yBot = yCenter - mn * amp;
      const barH = Math.max(1, yBot - yTop);
      wCtx.fillRect(px, yTop, 1, barH);
    }

    // Channel separator
    if (c < numCh - 1) {
      wCtx.strokeStyle = '#1e2433';
      wCtx.lineWidth = 1;
      wCtx.beginPath();
      wCtx.moveTo(0, chH * (c + 1));
      wCtx.lineTo(w, chH * (c + 1));
      wCtx.stroke();
    }
  }

  // Dim mask outside selection
  const x1 = secToX(trimStart);
  const x2 = secToX(trimEnd);
  wCtx.fillStyle = COLORS.maskFill;
  if (x1 > 0)  wCtx.fillRect(0, 0, Math.min(x1, w), h);
  if (x2 < w)  wCtx.fillRect(Math.max(x2, 0), 0, w - Math.max(x2, 0), h);

  // Handles
  drawHandle(x1, 'start', w, h);
  drawHandle(x2, 'end', w, h);

  // Playhead
  const px = secToX(headTime);
  if (px >= 0 && px <= w) {
    wCtx.strokeStyle = COLORS.playhead;
    wCtx.lineWidth = 1.5;
    wCtx.beginPath();
    wCtx.moveTo(px, 0);
    wCtx.lineTo(px, h);
    wCtx.stroke();

    // Triangle
    wCtx.fillStyle = COLORS.playhead;
    wCtx.beginPath();
    wCtx.moveTo(px - 7, 0);
    wCtx.lineTo(px + 7, 0);
    wCtx.lineTo(px, 11);
    wCtx.closePath();
    wCtx.fill();
  }

  wCtx.restore();
}

function drawHandle(px, type, w, h) {
  if (px < -HANDLE_HIT || px > w + HANDLE_HIT) return;
  const isHover = hoverHandle === type;
  const lineColor = isHover ? COLORS.handleLineHover : COLORS.handleLine;
  const fillColor = isHover ? COLORS.handleFillHover : COLORS.handleFill;

  wCtx.strokeStyle = lineColor;
  wCtx.lineWidth = isHover ? 2.5 : 2;
  wCtx.beginPath();
  wCtx.moveTo(px, 0);
  wCtx.lineTo(px, h);
  wCtx.stroke();

  // Grip rect
  const gh = 44, gw = 12;
  const gx = type === 'start' ? px - gw + 2 : px - 2;
  const gy = h / 2 - gh / 2;
  wCtx.fillStyle = fillColor;
  roundRect(wCtx, gx, gy, gw, gh, 3);
  wCtx.fill();

  // Arrow
  wCtx.fillStyle = 'rgba(255,255,255,0.9)';
  wCtx.font = '10px sans-serif';
  wCtx.textAlign = 'center';
  wCtx.textBaseline = 'middle';
  wCtx.fillText(type === 'start' ? '◀' : '▶', px + (type === 'start' ? -gw/2 + 2 : gw/2 - 2), h / 2);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawTimeline() {
  if (!audioBuf) return;
  const W = tlCanvas.width, H = tlCanvas.height;
  const w = W / dpr, h = H / dpr;

  tCtx.save();
  tCtx.scale(dpr, dpr);

  tCtx.fillStyle = COLORS.timeline;
  tCtx.fillRect(0, 0, w, h);

  // Grid intervals
  const vd = viewDur();
  const intervals = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600];
  let interval = 1;
  for (const iv of intervals) {
    if (vd / iv <= 25) { interval = iv; break; }
    interval = iv;
  }

  const startTick = Math.floor(scrollSec / interval) * interval;

  tCtx.fillStyle = COLORS.timelineText;
  tCtx.font = `${10}px 'Courier New'`;
  tCtx.textBaseline = 'middle';

  for (let t = startTick; t <= scrollSec + vd + interval; t = +(t + interval).toFixed(10)) {
    const x = secToX(t);
    if (x < 0 || x > w) continue;

    tCtx.strokeStyle = COLORS.timelineTick;
    tCtx.lineWidth = 1;
    tCtx.beginPath();
    tCtx.moveTo(x, 0);
    tCtx.lineTo(x, h);
    tCtx.stroke();

    tCtx.textAlign = x < 30 ? 'left' : 'center';
    tCtx.fillText(fmtTime(t), clamp(x, 2, w - 2), h / 2);
  }

  tCtx.restore();
}

// ─── Mouse interaction ────────────────────────────────────────
function getHandle(x) {
  const x1 = secToX(trimStart);
  const x2 = secToX(trimEnd);
  if (Math.abs(x - x1) < HANDLE_HIT) return 'start';
  if (Math.abs(x - x2) < HANDLE_HIT) return 'end';
  if (x > x1 && x < x2) return 'region';
  return null;
}

waveCanvas.addEventListener('mousedown', e => {
  if (!audioBuf) return;
  const rect = waveCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const sec = xToSec(x);
  const handle = getHandle(x);

  if (handle === 'start') {
    drag = { type: 'start' };
  } else if (handle === 'end') {
    drag = { type: 'end' };
  } else if (handle === 'region') {
    drag = { type: 'region', startX: x, origStart: trimStart, origEnd: trimEnd };
  } else {
    trimStart = clampSec(sec);
    trimEnd   = clampSec(sec);
    drag = { type: 'new', startSec: sec };
  }

  updateInputs();
  draw();
  e.preventDefault();
});

waveCanvas.addEventListener('mousemove', e => {
  if (!audioBuf) return;
  const rect = waveCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const sec = xToSec(x);

  if (drag) {
    switch (drag.type) {
      case 'start':
        trimStart = clampSec(sec);
        if (trimStart > trimEnd) { [trimStart, trimEnd] = [trimEnd, trimStart]; drag = { type: 'end' }; }
        break;
      case 'end':
        trimEnd = clampSec(sec);
        if (trimEnd < trimStart) { [trimStart, trimEnd] = [trimEnd, trimStart]; drag = { type: 'start' }; }
        break;
      case 'region': {
        const ds = (x - drag.startX) / wW() * viewDur();
        const len = drag.origEnd - drag.origStart;
        let ns = clampSec(drag.origStart + ds);
        let ne = ns + len;
        if (ne > dur()) { ne = dur(); ns = ne - len; }
        trimStart = ns; trimEnd = ne;
        break;
      }
      case 'new': {
        const s = drag.startSec;
        if (sec >= s) { trimStart = clampSec(s); trimEnd = clampSec(sec); }
        else           { trimStart = clampSec(sec); trimEnd = clampSec(s); }
        break;
      }
    }
    updateInputs();
    draw();
    return;
  }

  // Hover & cursor
  const prev = hoverHandle;
  hoverHandle = getHandle(x);

  if (hoverHandle === 'start' || hoverHandle === 'end') waveCanvas.style.cursor = 'ew-resize';
  else if (hoverHandle === 'region')                     waveCanvas.style.cursor = 'grab';
  else                                                   waveCanvas.style.cursor = 'crosshair';

  if (prev !== hoverHandle) draw();
});

window.addEventListener('mouseup', () => {
  if (drag) { drag = null; draw(); }
});

// Wheel: Ctrl = zoom, else pan
waveCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!audioBuf) return;

  if (e.ctrlKey || e.metaKey) {
    const rect = waveCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const pivot = xToSec(x);

    const factor = e.deltaY > 0 ? 0.75 : 1.33;
    zoom = clamp(zoom * factor, 1, 500);

    scrollSec = clamp(pivot - (x / wW()) * viewDur(), 0, Math.max(0, dur() - viewDur()));
    updateZoomLabel();
  } else {
    const delta = (e.deltaY !== 0 ? e.deltaY : e.deltaX) / wW() * viewDur();
    scrollSec = clamp(scrollSec + delta, 0, Math.max(0, dur() - viewDur()));
  }
  draw();
}, { passive: false });

// ─── Playback ─────────────────────────────────────────────────
function startPlayback(from, to) {
  if (!audioBuf) return;
  stopPlayback();

  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  playSource = audioCtx.createBufferSource();
  playSource.buffer = audioBuf;
  playSource.connect(audioCtx.destination);

  const segLen = to - from;
  playSource.start(0, from, segLen);
  playSource.onended = () => {
    if (isPlaying) {
      isPlaying = false;
      headTime = to;
      playBtn.textContent = '▶ 再生';
      updateTimeDisplay();
      draw();
    }
  };

  isPlaying = true;
  playStartAt = audioCtx.currentTime;
  playFrom = from;
  playTo = to;
  headTime = from;
  playBtn.textContent = '⏸ 一時停止';

  function animate() {
    if (!isPlaying) return;
    const elapsed = audioCtx.currentTime - playStartAt;
    headTime = Math.min(playFrom + elapsed, playTo);
    updateTimeDisplay();

    // Auto-scroll
    if (zoom > 1) {
      const margin = viewDur() * 0.08;
      if (headTime < scrollSec + margin) {
        scrollSec = clamp(headTime - margin, 0, dur() - viewDur());
      } else if (headTime > scrollSec + viewDur() - margin) {
        scrollSec = clamp(headTime - viewDur() + margin, 0, dur() - viewDur());
      }
    }

    draw();
    animId = requestAnimationFrame(animate);
  }
  animId = requestAnimationFrame(animate);
}

function stopPlayback() {
  if (playSource) { try { playSource.stop(); } catch(e) {} playSource = null; }
  isPlaying = false;
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  playBtn.textContent = '▶ 再生';
}

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    const pauseAt = headTime;
    stopPlayback();
    headTime = pauseAt;
    draw();
  } else {
    const from = (headTime >= dur() - 0.01) ? 0 : headTime;
    startPlayback(from, dur());
  }
});

playTrimBtn.addEventListener('click', () => {
  stopPlayback();
  headTime = trimStart;
  startPlayback(trimStart, trimEnd);
});

stopBtn.addEventListener('click', () => {
  stopPlayback();
  headTime = 0;
  updateTimeDisplay();
  draw();
});

// ─── Time display & input ─────────────────────────────────────
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = (sec % 60);
  return `${m}:${s.toFixed(3).padStart(6, '0')}`;
}

function parseFmtTime(str) {
  str = str.trim();
  const parts = str.split(':');
  if (parts.length === 2) return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
  return parseFloat(str);
}

function updateTimeDisplay() {
  playheadTime.textContent = fmtTime(headTime);
}

function updateInputs() {
  startInput.value = fmtTime(trimStart);
  endInput.value   = fmtTime(trimEnd);
  trimLenEl.textContent = '[' + fmtTime(trimEnd - trimStart) + ']';
}

startInput.addEventListener('change', () => {
  const t = parseFmtTime(startInput.value);
  if (!isNaN(t)) {
    trimStart = clampSec(t);
    if (trimStart > trimEnd) trimEnd = trimStart;
    updateInputs(); draw();
  }
});

endInput.addEventListener('change', () => {
  const t = parseFmtTime(endInput.value);
  if (!isNaN(t)) {
    trimEnd = clampSec(t);
    if (trimEnd < trimStart) trimStart = trimEnd;
    updateInputs(); draw();
  }
});

// ─── Zoom ─────────────────────────────────────────────────────
function updateZoomLabel() {
  zoomLabel.textContent = zoom >= 10
    ? '×' + Math.round(zoom)
    : '×' + zoom.toFixed(1).replace(/\.0$/, '');
}

zoomInBtn.addEventListener('click', () => {
  const center = scrollSec + viewDur() / 2;
  zoom = clamp(zoom * 1.5, 1, 500);
  scrollSec = clamp(center - viewDur() / 2, 0, Math.max(0, dur() - viewDur()));
  updateZoomLabel(); draw();
});

zoomOutBtn.addEventListener('click', () => {
  const center = scrollSec + viewDur() / 2;
  zoom = clamp(zoom / 1.5, 1, 500);
  scrollSec = clamp(center - viewDur() / 2, 0, Math.max(0, dur() - viewDur()));
  updateZoomLabel(); draw();
});

selAllBtn.addEventListener('click', () => {
  trimStart = 0; trimEnd = dur();
  updateInputs(); draw();
});

// ─── Keyboard ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (!audioBuf || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    playBtn.click();
  }
  if (e.key === 'a' || e.key === 'A') {
    trimStart = 0; trimEnd = dur();
    updateInputs(); draw();
  }
});

// ─── Export (WAV) ─────────────────────────────────────────────
exportBtn.addEventListener('click', () => {
  if (!audioBuf) return;

  const startSmp = Math.floor(trimStart * audioBuf.sampleRate);
  const endSmp   = Math.floor(trimEnd   * audioBuf.sampleRate);
  const length   = endSmp - startSmp;
  const numCh    = audioBuf.numberOfChannels;
  const sr       = audioBuf.sampleRate;

  if (length <= 0) { alert('トリム範囲が空です。\n波形をドラッグして範囲を選択してください。'); return; }

  showLoading('WAVエンコード中...');
  setTimeout(() => {
    try {
      // Interleaved PCM
      const interleaved = new Float32Array(length * numCh);
      for (let c = 0; c < numCh; c++) {
        const ch = audioBuf.getChannelData(c);
        for (let i = 0; i < length; i++) {
          interleaved[i * numCh + c] = ch[startSmp + i] ?? 0;
        }
      }

      const wavBuf = encodeWAV(interleaved, sr, numCh);
      const blob = new Blob([wavBuf], { type: 'audio/wav' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;

      const base = fileName.replace(/\.[^/.]+$/, '');
      const s = fmtTime(trimStart).replace(':', 'm').replace('.', 's');
      const te = fmtTime(trimEnd).replace(':', 'm').replace('.', 's');
      a.download = `${base}_${s}-${te}.wav`;
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) {
      alert('エクスポートに失敗しました: ' + e.message);
    }
    hideLoading();
  }, 30);
});

function encodeWAV(interleaved, sampleRate, numChannels) {
  const dataLen = interleaved.length * 2;
  const buf  = new ArrayBuffer(44 + dataLen);
  const view = new DataView(buf);

  const ws = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };

  ws(0, 'RIFF');
  view.setUint32(4,  36 + dataLen, true);
  ws(8, 'WAVE');
  ws(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);  // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true);
  ws(36, 'data');
  view.setUint32(40, dataLen, true);

  let off = 44;
  for (let i = 0; i < interleaved.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, interleaved[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  return buf;
}

// ─── Init ─────────────────────────────────────────────────────
window.addEventListener('resize', () => { if (audioBuf) { resizeCanvases(); draw(); } });
</script>
