<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧭 ラシンバン — ホーム</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #06090F; --surface: #0D1521; --surface2: #121E2E; --surface3: #192840;
  --border: #1E3248; --border2: #253D55; --text: #E8EEF6; --muted: #5A7A9A; --dim: #8BA3BE;
  --primary: #5B6EF5; --primary-light: #818CF8;
  --secondary: #9B6EF5; --success: #0FBA81; --warn: #F5A623;
  --card-shadow: 0 4px 24px rgba(0,0,0,.45);
}
body { background: var(--bg); color: var(--text); font-family: -apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

/* Header */
.hdr { position: sticky; top: 0; z-index: 100; background: rgba(6,9,15,.97); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 58px; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 20px rgba(0,0,0,.4); }
.hdr-logo { font-size: 17px; font-weight: 800; background: linear-gradient(135deg,#818CF8,#A78BFA,#F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
.hdr-sub { font-size: 12px; color: var(--muted); flex: 1; }
.hdr-btn { background: rgba(91,110,245,.15); border: 1px solid rgba(91,110,245,.35); color: var(--primary-light); padding: 6px 14px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all .15s; white-space: nowrap; }
.hdr-btn:hover { background: rgba(91,110,245,.28); }

/* Main */
main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
.sec { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 14px; }

/* File Grid */
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.file-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; cursor: pointer; transition: all .2s; text-decoration: none; color: inherit; display: block; position: relative; overflow: hidden; }
.file-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg,#5B6EF5,#9B6EF5); border-radius: 14px 14px 0 0; }
.file-card:hover { border-color: var(--primary); box-shadow: 0 8px 32px rgba(91,110,245,.15); transform: translateY(-2px); }
.file-card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.file-card-theme { font-size: 12px; color: var(--dim); margin-bottom: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.file-card-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.meta-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
.badge-flow { background: rgba(91,110,245,.12); border: 1px solid rgba(91,110,245,.25); color: var(--primary-light); }
.badge-date { background: rgba(90,122,154,.1); border: 1px solid rgba(90,122,154,.2); color: var(--muted); }
.badge-period { background: rgba(15,186,129,.1); border: 1px solid rgba(15,186,129,.2); color: #6EE7B7; }
.file-card-fn { font-size: 10px; color: var(--muted); margin-top: 10px; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Empty / Loading */
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state-icon { font-size: 40px; margin-bottom: 14px; }
.empty-state-t { font-size: 16px; font-weight: 600; color: var(--dim); margin-bottom: 8px; }
.empty-state-d { font-size: 13px; line-height: 1.7; }
.loading { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Error banner */
.err-banner { background: rgba(239,68,85,.1); border: 1px solid rgba(239,68,85,.3); color: #FCA5A5; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }

/* Modal */
.modal-ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 500; align-items: center; justify-content: center; }
.modal-ov.on { display: flex; }
.modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: min(480px, 94vw); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.modal-body { font-size: 13px; color: var(--dim); line-height: 1.75; margin-bottom: 16px; }
.modal-code { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; font-family: 'Courier New', monospace; font-size: 14px; color: var(--primary-light); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal-code-text { flex: 1; }
.modal-copy-btn { background: rgba(91,110,245,.2); border: 1px solid rgba(91,110,245,.4); color: var(--primary-light); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; transition: all .15s; }
.modal-copy-btn:hover { background: rgba(91,110,245,.35); }
.modal-steps { list-style: none; counter-reset: steps; }
.modal-steps li { counter-increment: steps; display: flex; gap: 10px; font-size: 12px; color: var(--dim); margin-bottom: 8px; }
.modal-steps li::before { content: counter(steps); background: rgba(91,110,245,.2); color: var(--primary-light); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.modal-acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.modal-close { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }

/* Toast */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--surface2); border: 1px solid var(--primary); color: var(--text); padding: 7px 16px; border-radius: 8px; font-size: 12px; opacity: 0; transition: all .25s; z-index: 700; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) { .file-grid { grid-template-columns: 1fr; } main { padding: 20px 16px; } }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">🧭 ラシンバン</div>
  <div class="hdr-sub">目標達成コンパス — ファイル一覧</div>
  <button class="hdr-btn" onclick="showNewModal()">＋ 新規作成</button>
</header>

<main>
  <div class="sec">📁 保存済みコンパス</div>
  <div id="statusArea"></div>
  <div id="fileGrid" class="file-grid"></div>
</main>

<!-- 新規作成モーダル -->
<div class="modal-ov" id="newModal">
  <div class="modal-box">
    <div class="modal-title">＋ 新しい羅針盤を作成する</div>
    <div class="modal-body">
      羅針盤は <strong style="color:var(--primary-light)">Claude Code</strong> で生成します。<br>
      Claude Codeのチャット欄に以下のコマンドを入力してください。
    </div>
    <div class="modal-code">
      <span class="modal-code-text">/rashinban</span>
      <button class="modal-copy-btn" onclick="copyCommand()">📋 コピー</button>
    </div>
    <ol class="modal-steps">
      <li>上のコマンドをコピーする</li>
      <li>Claude Codeのチャット欄にペーストしてEnterを押す</li>
      <li>KaiがヒアリングしてHTMLを自動生成します</li>
      <li>生成完了後、このページをリロードすると一覧に表示されます</li>
    </ol>
    <div class="modal-acts">
      <button class="modal-close" onclick="closeNewModal()">閉じる</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = 'http://localhost:3457';

async function loadFiles() {
  const status = document.getElementById('statusArea');
  const grid = document.getElementById('fileGrid');
  status.innerHTML = '<div class="loading"><div class="spinner"></div>ファイルを読み込み中...</div>';
  grid.innerHTML = '';

  try {
    const res = await fetch(`${API}/api/files`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const files = await res.json();
    status.innerHTML = '';

    if (files.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-state-icon">🧭</div>
          <div class="empty-state-t">まだ羅針盤がありません</div>
          <div class="empty-state-d">「＋ 新規作成」ボタンから最初の羅針盤を作成してください。</div>
        </div>`;
      return;
    }

    files.forEach(f => {
      const card = document.createElement('a');
      card.className = 'file-card';
      card.href = `/${encodeURIComponent(f.filename)}`;
      card.target = '_blank';

      const badges = [
        f.flowCount > 0 ? `<span class="meta-badge badge-flow">📊 フロー ${f.flowCount}件</span>` : '',
        f.createdAt   ? `<span class="meta-badge badge-date">📅 ${f.createdAt}</span>` : '',
        f.targetPeriod ? `<span class="meta-badge badge-period">🎯 ${f.targetPeriod}</span>` : '',
      ].filter(Boolean).join('');

      card.innerHTML = `
        <div class="file-card-title">${esc(f.title)}</div>
        <div class="file-card-theme">${esc(f.theme || f.filename)}</div>
        <div class="file-card-meta">${badges}</div>
        <div class="file-card-fn">${esc(f.filename)}</div>`;
      grid.appendChild(card);
    });

  } catch (e) {
    status.innerHTML = `
      <div class="err-banner">
        ⚠️ ファイルの読み込みに失敗しました。server.py が起動していることを確認してください。<br>
        <small style="opacity:.7">${e.message}</small>
      </div>`;
    grid.innerHTML = '';
  }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── モーダル ── */
function showNewModal() {
  document.getElementById('newModal').classList.add('on');
}
function closeNewModal() {
  document.getElementById('newModal').classList.remove('on');
}
document.getElementById('newModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeNewModal();
});

function copyCommand() {
  navigator.clipboard.writeText('/rashinban')
    .then(() => toast('✅ コマンドをコピーしました'))
    .catch(() => toast('コピー失敗 — 手動でコピーしてください'));
}

/* ── Toast ── */
let _tid;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_tid);
  _tid = setTimeout(() => el.classList.remove('show'), 2400);
}

loadFiles();
</script>
</body>
</html>
