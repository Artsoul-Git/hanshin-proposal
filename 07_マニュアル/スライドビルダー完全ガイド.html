<script>
(function() {
  function addCopyBtn(el) {
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = '繧ｳ繝斐・';
    el.appendChild(btn);
    btn.addEventListener('click', function() {
      var clone = el.cloneNode(true);
      clone.querySelectorAll('.copy-btn').forEach(function(b) { b.remove(); });
      var text = clone.innerText.trim();
      var ok = function() {
        btn.textContent = '繧ｳ繝斐・貂医∩ 笨・;
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = '繧ｳ繝斐・'; btn.classList.remove('copied'); }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(function() { fallback(text); ok(); });
      } else { fallback(text); ok(); }
    });
  }
  function fallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
  document.querySelectorAll('.prompt-box').forEach(addCopyBtn);
})();
</script>
