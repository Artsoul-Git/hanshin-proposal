<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI記録自動生成</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif; background:#F7FAFC; color:#2D3748; min-height:100vh; }

/* ヘッダー */
.hdr { background:#2B6CB0; color:white; padding:13px 14px; position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:10px; box-shadow:0 2px 6px rgba(0,0,0,0.2); }
.hdr-title { font-size:15px; font-weight:bold; flex:1; }
.back-btn { background:rgba(255,255,255,0.2); border:none; color:white; padding:6px 12px; border-radius:20px; cursor:pointer; font-size:13px; display:none; }

/* 画面 */
.screen { display:none; padding:14px; padding-bottom:32px; }
.screen.active { display:block; }

/* カード */
.card { background:white; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.07); padding:16px; margin-bottom:14px; }
.card-title { font-size:12px; font-weight:bold; color:#2B6CB0; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.card-title::before { content:''; display:block; width:3px; height:14px; background:#2B6CB0; border-radius:2px; }

/* 利用者リスト */
.user-btn { width:100%; background:white; border:1.5px solid #E2E8F0; border-radius:10px; padding:12px 14px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:12px; margin-bottom:8px; transition:all 0.15s; }
.user-btn:active, .user-btn.selected { background:#EBF8FF; border-color:#2B6CB0; }
.avatar { width:40px; height:40px; border-radius:50%; background:#2B6CB0; color:white; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:bold; flex-shrink:0; }
.user-name { font-size:15px; font-weight:bold; color:#1A365D; }
.user-kana { font-size:11px; color:#718096; margin-top:2px; }

/* 書類種別 */
.doctype-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.doctype-btn { background:white; border:2px solid #E2E8F0; border-radius:10px; padding:14px 8px; text-align:center; cursor:pointer; transition:all 0.15s; }
.doctype-btn:active, .doctype-btn.selected { border-color:#2B6CB0; background:#EBF8FF; }
.doctype-icon { font-size:24px; margin-bottom:6px; }
.doctype-label { font-size:12px; font-weight:bold; color:#2D3748; line-height:1.3; }

/* 選択中バナー */
.sel-banner { background:#EBF8FF; border-radius:8px; padding:10px 14px; margin-bottom:14px; border-left:4px solid #2B6CB0; }
.sel-banner .sel-title { font-size:10px; color:#718096; }
.sel-banner .sel-body { font-size:14px; font-weight:bold; color:#1A365D; margin-top:2px; }

/* フォーム */
.form-label { font-size:12px; font-weight:bold; color:#4A5568; margin-bottom:5px; display:block; }
.form-input { width:100%; border:2px solid #E2E8F0; border-radius:8px; padding:11px 12px; font-size:14px; font-family:inherit; color:#2D3748; }
.form-input:focus { outline:none; border-color:#2B6CB0; }
.textarea { width:100%; min-height:220px; border:2px solid #E2E8F0; border-radius:8px; padding:12px; font-size:13px; font-family:inherit; line-height:1.8; resize:vertical; color:#2D3748; }
.textarea:focus { outline:none; border-color:#2B6CB0; }
.textarea-result { width:100%; min-height:280px; border:2px solid #9AE6B4; border-radius:8px; padding:12px; font-size:13px; font-family:inherit; line-height:1.8; resize:vertical; color:#2D3748; background:#FAFFFE; }
.textarea-result:focus { outline:none; border-color:#38A169; }

/* ボタン */
.btn { display:block; width:100%; padding:15px; border:none; border-radius:10px; font-size:15px; font-weight:bold; cursor:pointer; margin-bottom:10px; transition:all 0.15s; font-family:inherit; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn-primary { background:#2B6CB0; color:white; }
.btn-primary:active:not(:disabled) { background:#1A4F8B; }
.btn-success { background:#38A169; color:white; }
.btn-success:active { background:#276749; }
.btn-outline { background:white; color:#2B6CB0; border:2px solid #2B6CB0; }
.btn-ghost { background:white; color:#718096; border:2px solid #E2E8F0; }

/* アラート */
.alert { padding:11px 14px; border-radius:8px; font-size:12px; margin-bottom:12px; line-height:1.6; }
.alert-info { background:#EBF8FF; color:#2B6CB0; border:1px solid #BEE3F8; }
.alert-success { background:#F0FFF4; color:#276749; border:1px solid #9AE6B4; }
.alert-warn { background:#FFFAF0; color:#C05621; border:1px solid #F6AD55; }
.alert-error { background:#FFF5F5; color:#C53030; border:1px solid #FEB2B2; }

/* ローディング */
.loading-wrap { text-align:center; padding:70px 20px; }
.spinner { width:52px; height:52px; border:4px solid #BEE3F8; border-top-color:#2B6CB0; border-radius:50%; margin:0 auto 20px; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-msg { font-size:15px; font-weight:bold; color:#2B6CB0; margin-bottom:6px; }
.loading-sub { font-size:12px; color:#718096; line-height:1.6; }

/* 完了画面 */
.done-icon { font-size:56px; text-align:center; margin:20px 0 12px; }
.done-title { font-size:18px; font-weight:bold; color:#276749; text-align:center; margin-bottom:8px; }
.done-sub { font-size:12px; color:#718096; text-align:center; margin-bottom:24px; }

/* 文字数カウンター */
.char-count { font-size:11px; color:#718096; text-align:right; margin-top:4px; }
</style>
</head>
<body>

<div class="hdr">
  <button class="back-btn" id="backBtn" onclick="goBack()">← 戻る</button>
  <div class="hdr-title" id="hdrTitle">AI記録自動生成システム</div>
</div>

<!-- ===== Screen 1: 利用者・書類種別選択 ===== -->
<div class="screen active" id="s-select">

  <div class="card">
    <div class="card-title">利用者を選択</div>
    <div id="userList"><div style="text-align:center;color:#718096;padding:24px;font-size:13px;">読み込み中...</div></div>
  </div>

  <div class="card" id="docCard" style="display:none;">
    <div class="card-title">書類の種別を選択</div>
    <div class="doctype-grid" id="docGrid"></div>
  </div>

  <div id="nextWrap" style="display:none;">
    <button class="btn btn-primary" onclick="goToInput()">入力へ進む →</button>
  </div>

</div>

<!-- ===== Screen 2: テキスト入力 ===== -->
<div class="screen" id="s-input">

  <div class="sel-banner">
    <div class="sel-title">対象</div>
    <div class="sel-body" id="selBanner">—</div>
  </div>

  <div class="card">
    <label class="form-label" for="staffName">担当者名</label>
    <input class="form-input" id="staffName" type="text" placeholder="例：山田 花子">
  </div>

  <div class="card">
    <div class="card-title">面談メモ・記録</div>
    <div class="alert alert-info">面談中のメモや覚えていることを自由に入力してください。AIが書類形式に整えます。個人情報は送信前に自動でマスキングされます。</div>
    <textarea class="textarea" id="inputText"
      placeholder="例：
・封入作業を担当。集中して取り組めていた。
・体調確認：睡眠がとれているとのこと。
・来週の通院について確認。同行支援の希望あり。
・余暇の話題で表情がやわらかくなった。"
      oninput="updateCharCount()"></textarea>
    <div class="char-count" id="charCount">0 文字</div>
  </div>

  <button class="btn btn-primary" id="genBtn" onclick="startGenerate()">AIで書類を生成する ✨</button>

</div>

<!-- ===== Screen 3: 生成中 ===== -->
<div class="screen" id="s-loading">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-msg">書類を生成中...</div>
    <div class="loading-sub">AIが記録を整形しています。<br>20〜40秒ほどお待ちください。</div>
  </div>
</div>

<!-- ===== Screen 4: 結果確認 ===== -->
<div class="screen" id="s-result">

  <div class="alert alert-success">✅ 書類が生成されました。内容を確認・修正してから保存してください。</div>

  <div class="card">
    <div class="card-title">生成された書類（直接修正できます）</div>
    <textarea class="textarea-result" id="resultText"></textarea>
  </div>

  <button class="btn btn-success" onclick="saveDoc()">この内容で保存する 💾</button>
  <button class="btn btn-outline" onclick="startGenerate()">再生成する</button>
  <button class="btn btn-ghost" onclick="showScreen('s-select', 'AI記録自動生成システム')">最初からやり直す</button>

</div>

<!-- ===== Screen 5: 保存完了 ===== -->
<div class="screen" id="s-done">
  <div class="card">
    <div class="done-icon">✅</div>
    <div class="done-title">保存完了</div>
    <div class="done-sub" id="savedAt"></div>
    <button class="btn btn-primary" onclick="showScreen('s-select', 'AI記録自動生成システム')">次の記録を作成する</button>
    <button class="btn btn-outline" onclick="showScreen('s-input', '入力')">同じ利用者で別の書類を作る</button>
  </div>
</div>

<script>
// ========== 状態 ==========
const S = { user: null, docType: null, sessionId: null };

// ========== 起動 ==========
window.addEventListener('load', () => {
  google.script.run.withSuccessHandler(renderUsers).withFailureHandler(loadErr).serverGetUsers();
  google.script.run.withSuccessHandler(renderDocTypes).withFailureHandler(loadErr).serverGetDocTypes();
});

// ========== 画面遷移 ==========
const SCREEN_HISTORY = [];

function showScreen(id, title) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('hdrTitle').textContent = title || '';
  document.getElementById('backBtn').style.display = id === 's-select' ? 'none' : 'block';
  window.scrollTo(0, 0);
  SCREEN_HISTORY.push(id);
}

function goBack() {
  SCREEN_HISTORY.pop(); // 現在
  const prev = SCREEN_HISTORY.pop(); // 一個前
  const titles = { 's-select': 'AI記録自動生成システム', 's-input': '入力', 's-result': '結果確認' };
  if (prev) showScreen(prev, titles[prev]);
}

// ========== 利用者レンダリング ==========
function renderUsers(users) {
  const el = document.getElementById('userList');
  if (!users || !users.length) {
    el.innerHTML = '<div style="color:#718096;text-align:center;padding:20px;font-size:13px;">利用者マスターに登録がありません</div>';
    return;
  }
  el.innerHTML = users.map(u =>
    `<button class="user-btn" onclick="selectUser('${esc(u.id)}','${esc(u.name)}',this)">
       <div class="avatar">${u.name.charAt(0)}</div>
       <div><div class="user-name">${esc(u.name)}</div><div class="user-kana">${esc(u.nameKana)}</div></div>
     </button>`
  ).join('');
}

function renderDocTypes(types) {
  document.getElementById('docGrid').innerHTML = types.map(t =>
    `<button class="doctype-btn" onclick="selectDoc('${esc(t.id)}','${esc(t.label)}',this)">
       <div class="doctype-icon">${t.icon || '📄'}</div>
       <div class="doctype-label">${esc(t.label)}</div>
     </button>`
  ).join('');
}

function loadErr(e) {
  document.getElementById('userList').innerHTML =
    `<div class="alert alert-error">読み込みに失敗しました：${e.message || e}</div>`;
}

// ========== 選択操作 ==========
function selectUser(id, name, btn) {
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  S.user = { id, name };
  document.getElementById('docCard').style.display = 'block';
  checkNext();
}

function selectDoc(id, label, btn) {
  document.querySelectorAll('.doctype-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  S.docType = { id, label };
  checkNext();
}

function checkNext() {
  document.getElementById('nextWrap').style.display = (S.user && S.docType) ? 'block' : 'none';
}

function goToInput() {
  document.getElementById('selBanner').textContent = `${S.user.name} ／ ${S.docType.label}`;
  showScreen('s-input', '入力');
}

// ========== 生成 ==========
function startGenerate() {
  const text  = document.getElementById('inputText').value.trim();
  const staff = document.getElementById('staffName').value.trim();
  if (!staff) { alert('担当者名を入力してください'); return; }
  if (!text)  { alert('面談メモを入力してください'); return; }

  showScreen('s-loading', '生成中');

  google.script.run
    .withSuccessHandler(onGenerated)
    .withFailureHandler(onGenerateErr)
    .serverGenerateDocument({ userId: S.user.id, userName: S.user.name, docTypeId: S.docType.id, inputText: text, staffName: staff });
}

function onGenerated(r) {
  if (r.error) { onGenerateErr({ message: r.error }); return; }
  S.sessionId = r.sessionId;
  document.getElementById('resultText').value = r.generatedText;
  showScreen('s-result', '結果確認');
}

function onGenerateErr(e) {
  showScreen('s-input', '入力');
  alert('生成に失敗しました：' + (e.message || e));
}

// ========== 保存 ==========
function saveDoc() {
  const text = document.getElementById('resultText').value.trim();
  if (!text) { alert('保存する内容がありません'); return; }

  google.script.run
    .withSuccessHandler(onSaved)
    .withFailureHandler(e => alert('保存失敗：' + (e.message || e)))
    .serverSaveDocument({
      userId: S.user.id, userName: S.user.name,
      docTypeId: S.docType.id,
      staffName: document.getElementById('staffName').value,
      generatedText: text,
      sessionId: S.sessionId,
    });
}

function onSaved(r) {
  document.getElementById('savedAt').textContent = `保存日時：${r.savedAt}`;
  showScreen('s-done', '完了');
}

// ========== ユーティリティ ==========
function updateCharCount() {
  const n = document.getElementById('inputText').value.length;
  document.getElementById('charCount').textContent = n.toLocaleString() + ' 文字';
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
