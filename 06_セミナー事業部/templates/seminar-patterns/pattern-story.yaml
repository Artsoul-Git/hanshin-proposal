pattern_name: story
display_name: "ストーリー型（ブランディング・採用）"
description: "物語で記憶に残す。ブランディング・採用イベント・カンファレンス基調講演"
recommended_for:
  - 採用イベント
  - 基調講演
  - 周年イベント
  - 創業者ストーリー
target_outcome: "感情的共感・ブランド記憶"
sales_pressure: low

structure:
  opening:
    duration_minutes: 5
    slides:
      - type: タイトル
        purpose: 詩的・象徴的なタイトル
      - type: 引用
        purpose: 印象的な引用で始める
      - type: 問いかけ
        purpose: 感情的な問いかけ

  story:
    duration_minutes: 30
    structure:
      - chapter:
          name: "起：始まり"
          slides_count_range: [10, 15]
          flow: "原点 → 出会い → 気づき"
      - chapter:
          name: "承：困難"
          slides_count_range: [10, 15]
          flow: "壁 → 葛藤 → 決断"
      - chapter:
          name: "転：転機"
          slides_count_range: [10, 15]
          flow: "出会い → 学び → 変化"
      - chapter:
          name: "結：今"
          slides_count_range: [10, 15]
          flow: "現在地 → 見えてきたもの → 未来へ"

  message:
    duration_minutes: 10
    slides:
      - type: 引用
        purpose: 中核メッセージの引用
      - type: キーメッセージ
        purpose: 物語が伝える本質
      - type: コンテンツ
        purpose: 受講者への問い
      - type: 引用
        purpose: 結びの言葉

  call_to_action:
    duration_minutes: 5
    slides:
      - type: CTA
        purpose: 詳細を知りたい方へ
      - type: コンテンツ
        purpose: 連絡先・次のステップ

  qa:
    duration_minutes: 10
    slides:
      - type: コンテンツ
        purpose: 深い対話のQ&A

  total_slides_target: 75
